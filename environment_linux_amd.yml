# PhytoFlow Conda Environment for Linux x86_64 with AMD GPU
# Platform: Linux x86_64 (AMD64)
# Python: 3.11
# Features: AMD ROCm GPU acceleration, all features enabled

name: phytoflow_linux_amd

channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.11
  - pip>=23.0
  
  # Scientific computing
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  
  # Visualization
  - streamlit>=1.28.0
  - altair>=5.0.0
  - plotly>=5.14.0
  
  # Geometry and 3D
  - shapely>=2.0.0
  - trimesh>=4.0.0
  
  # Image processing (optional, for Digital Twin feature)
  - opencv>=4.8.0
  - scikit-image>=0.21.0
  
  # Optimization
  - cma>=3.3.0
  
  # Testing
  - pytest>=7.4.0
  - pytest-cov>=4.1.0
  
  # Development tools
  - black
  - flake8
  
  # Install via pip (not available in conda or better from pip)
  - pip:
      # GPU acceleration - CuPy for AMD ROCm
      # Choose based on your ROCm version:
      - cupy-rocm-5-0  # For ROCm 5.x (most common)
      # - cupy-rocm-6-0  # For ROCm 6.x - uncomment if needed
      
      # Additional visualization
      - vega-datasets
      
      # Optional: Advanced ML (if using PINN/GNN features with GPU)
      # Uncomment if needed:
      # - torch>=2.0.0  # PyTorch with ROCm support
      # - deepxde>=1.10.0
      # - torch-geometric>=2.4.0

# Installation instructions:
# 1. Install ROCm first (if not already installed):
#    https://rocm.docs.amd.com/en/latest/deploy/linux/quick_start.html
# 2. Verify ROCm:
#    rocm-smi  # Should show your AMD GPU
# 3. Save this file as environment_linux_amd.yml
# 4. Create environment:
#    conda env create -f environment_linux_amd.yml
# 5. Activate:
#    conda activate phytoflow_linux_amd
# 6. Verify GPU:
#    python -c "import cupy; print('CuPy-ROCm installed')"
# 7. Run app:
#    streamlit run src/app.py

# Note:
# - ROCm only supports specific AMD GPUs (RX 6000/7000 series, Instinct)
# - Check compatibility: https://rocm.docs.amd.com/en/latest/release/gpu_os_support.html
# - For ROCm 6.x, replace cupy-rocm-5-0 with cupy-rocm-6-0
# - ROCm is NOT available on Windows or macOS

# Requirements:
# - Linux x86_64 (Ubuntu 20.04+, RHEL 8+, SLES 15 SP3+)
# - AMD Radeon RX 6000/7000 series or Instinct GPU
# - ROCm 5.0+ or 6.0+ installed
# - Conda or Miniconda installed
