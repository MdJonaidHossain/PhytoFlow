# PhytoFlow Conda Environment for Linux ARM64 (including Raspberry Pi)
# Platform: Linux ARM64/AARCH64
# Python: 3.11
# Features: CPU-only (optimized for ARM), all features enabled

name: phytoflow_linux_arm

channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.11
  - pip>=23.0
  
  # Scientific computing with OpenBLAS for optimized ARM CPU performance
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  - openblas
  
  # Visualization
  - streamlit>=1.28.0
  - altair>=5.0.0
  - plotly>=5.14.0
  
  # Geometry and 3D
  - shapely>=2.0.0
  - trimesh>=4.0.0
  
  # Image processing (optional, for Digital Twin feature)
  - opencv>=4.8.0
  - scikit-image>=0.21.0
  
  # Optimization
  - cma>=3.3.0
  
  # Testing
  - pytest>=7.4.0
  - pytest-cov>=4.1.0
  
  # Development tools
  - black
  - flake8
  
  # Install via pip (not available in conda or better from pip)
  - pip:
      # Additional visualization and SVG export
      - svgwrite>=1.4.3
      - vega-datasets
      
      # Optional: Advanced ML (if using PINN/GNN features, CPU version)
      # Uncomment if needed:
      # - torch>=2.0.0  # PyTorch with ARM support
      # - deepxde>=1.10.0
      # - torch-geometric>=2.4.0

# Installation instructions:
# 1. Save this file as environment_linux_arm.yml
# 2. Create environment:
#    conda env create -f environment_linux_arm.yml
# 3. Activate:
#    conda activate phytoflow_linux_arm
# 4. Run app:
#    streamlit run src/app.py

# Performance notes:
# - Optimized for ARM architecture (Raspberry Pi 4/5, ARM servers, etc.)
# - Automatically uses all CPU cores
# - Works well on single-board computers
# - May be slower than x86_64 but still functional

# Note:
# - MLX is NOT available on Linux ARM (macOS Apple Silicon only)
# - Some packages may take longer to install on ARM
# - Raspberry Pi 4 (4GB+ RAM) recommended minimum
# - For Raspberry Pi, consider using Raspberry Pi OS 64-bit

# Requirements:
# - Linux ARM64/AARCH64 (Ubuntu ARM, Raspberry Pi OS 64-bit, etc.)
# - 4GB+ RAM recommended (2GB minimum)
# - Conda or Miniconda installed (use Miniforge for ARM)
# - Download Miniforge: https://github.com/conda-forge/miniforge
